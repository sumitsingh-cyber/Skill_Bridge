services:
  - type: web
    name: skillbridge-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MAIL_FROM
        value: ankitsingh91040@gmail.com
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
      - key: FOLDER_NAME
        value: SkillBridge
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://skill-bridge-ruddy-beta.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://skill-bridge-ruddy-beta.vercel.app,https://skill-bridge-lemon.vercel.app,https://skill-bridge-sumit-singhs-projects-140ed6ee.vercel.app
